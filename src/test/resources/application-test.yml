spring:
  application:
    name: accesshub-iam-test
  datasource:
    url: jdbc:h2:mem:accesshub_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

accesshub:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    issuer: AccessHub Test
  rate-limit:
    max-login-attempts: 5
    lockout-duration-minutes: 15
  rag:
    llm-api-key: mock-key
